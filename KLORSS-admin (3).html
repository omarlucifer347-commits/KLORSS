.wrap{max-width:1300px;margin:auto;padding:0 12px}
.hero{text-align:center;padding:40px 12px 8px}
.logo{margin:0;font-size:clamp(40px,12vw,84px);font-weight:800;letter-spacing:.14em;text-shadow:0 0 24px rgba(77,163,255,.5)}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px}
nav button{background:#000;color:var(--c);border:1px solid var(--l);border-radius:99px;padding:6px 16px;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}
nav button.on{background:var(--c);color:#000;font-weight:600}
.t1{margin:26px 0 12px;font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#000;border:1px solid var(--l);border-radius:14px;overflow:hidden}
.gw{position:relative;aspect-ratio:4/5;background:#000}
.gal{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.ph{display:grid;place-items:center;font-size:26px;font-weight:800;letter-spacing:.1em;color:var(--d)}
.dots{position:absolute;bottom:8px;inset-inline:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:9px;background:#4da3ff55;transition:.2s}
.dots i.on{width:16px;background:var(--c)}
.ar{position:absolute;top:50%;translate:0 -50%;width:30px;height:30px;border-radius:50%;border:1px solid var(--l);background:#000b;color:var(--c);font-size:18px;cursor:pointer;line-height:1}
.ar.p{left:6px}.ar.n{right:6px}
.bd{position:absolute;top:8px;left:8px;z-index:1;background:#000;border:1px solid var(--c);color:var(--c);font-weight:800;font-size:12px;padding:2px 8px;border-radius:7px}
.out .gal{opacity:.3;filter:grayscale(1)}
.so{position:absolute;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none;font-weight:800;letter-spacing:.14em;font-size:14px}
.so b{background:#000;border:1px solid var(--c);padding:6px 14px;border-radius:8px}
.ord.no{color:var(--d);border-color:var(--l);pointer-events:none}
.inf{padding:10px}
.inf h3{margin:0 0 4px;font-size:14px;font-weight:600}
.pr{font-weight:800;font-size:16px}
.pr s{color:var(--d);font-size:12px;font-weight:400;margin-inline-start:6px}
.sz{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
.sz button{background:#000;color:var(--c);border:1px solid var(--l);border-radius:7px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
.sz button.on{background:var(--c);color:#000;font-weight:600}
.sz button.x{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.szs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:#000;color:var(--c);border:1px solid var(--c);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.chip.no{opacity:.55;text-decoration:line-through;border-color:#c33;color:#f88}
.ord{display:block;text-align:center;background:#000;color:var(--c);border:1px solid var(--c);border-radius:9px;padding:9px 4px;font-weight:600;font-size:13px;text-decoration:none;letter-spacing:.03em}
.ord:hover{box-shadow:0 0 12px rgba(77,163,255,.5)}
.hint{text-align:center;color:var(--d);font-size:13px}
footer{text-align:center;color:var(--d);padding:34px 12px 96px;font-size:13px}
footer a{color:var(--c)}
.wa,#gear{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;background:#000;border:1px solid var(--c);display:grid;place-items:center;font-size:22px;text-decoration:none;cursor:pointer;z-index:5;box-shadow:0 0 14px rgba(77,163,255,.4)}
.wa{right:16px}#gear{left:16px}
.adm{position:fixed;inset:0;background:#000;z-index:20;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.adm>*{max-width:680px;margin-inline:auto}
.adm label{display:block;color:var(--d);font-size:13px}
.adm input{width:100%;background:#000;border:1px solid var(--l);color:var(--c);border-radius:10px;padding:11px;font:inherit;margin:4px 0}
.adm ::placeholder{color:var(--d)}
.sec{border:1px solid var(--c);border-radius:16px;padding:12px;margin-top:18px}
.pa{border:1px solid var(--l);border-radius:12px;padding:10px;margin-top:12px}
.r2{display:flex;gap:8px;align-items:center}.r2>*{flex:1}
.th{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.t{position:relative}.t img{width:60px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--l);cursor:pointer}
.t b{position:absolute;top:-6px;right:-6px;background:#000;border:1px solid var(--c);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;cursor:pointer}
.btn{display:block;width:100%;text-align:center;background:#000;color:var(--c);border:1px solid var(--c);border-radius:12px;padding:11px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.pri{box-shadow:0 0 14px rgba(77,163,255,.45)}
.dng{border-color:#e5484d;color:#e5484d}
.ah{display:flex;justify-content:space-between;align-items:center}.ah .btn{width:auto;margin:0}
#t{position:fixed;left:50%;bottom:90px;translate:-50% 0;background:#000;border:1px solid var(--c);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:30}
#t.show{opacity:1}
</style><style>artifact-sync,artifact-local{display:contents}</style>

<body>
<div id="app"></div>
<div id="adm" class="adm" hidden=""></div>
<button id="gear" hidden="" aria-label="Admin">⚙️</button>
<div id="t"></div>
<script id="data" type="application/json">{"wa":"201092207481","sections":[{"name":"Hoodies","products":[{"name":"Black boxfit hoodie","price":"500","sizes":" XL, XXL","imgs":[],"old":"700"},{"name":"Burgandy boxfit hoodie ","price":"500","sizes":" L, XL, XXL","imgs":[]},{"name":"White box fit hoodie","price":"500","sizes":"L, XL, XXL","imgs":[]},{"name":"Green olive box fit hoodie","price":"500","sizes":"L,Xl,XXL","imgs":[]},{"name":"Dark gray box fit hoodie","price":"500","sizes":"L, Xl, XXl","imgs":[]}]},{"name":"Sweetpants ","products":[{"name":"Black sweetpants","price":0,"old":"","sizes":"M, L, XL","imgs":[]}]},{"name":"New section","products":[]}]}</script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse($('#data').textContent)}catch(e){S={}}
S.wa=S.wa||'201092207481';
if(!S.sections){S.sections=[{name:'Hoodies',products:S.products||[]}];delete S.products}
const fmt=n=>Number(n||0).toLocaleString('en');
const off=p=>+p.old>+p.price&&+p.price>0,pct=p=>Math.round((1-p.price/p.old)*100);
const link=(p,z)=>'https://wa.me/'+S.wa+'?text='+encodeURIComponent('Hi KLORSS, I want to order:\n'+p.name+'\n'+(z?'Size: '+z+'\n':'')+'Price: '+fmt(p.price)+' EGP'+(off(p)?' (offer, was '+fmt(p.old)+')':''));
const disp=()=>S.wa.startsWith('20')?'0'+S.wa.slice(2):S.wa;
let tt;const toast=m=>{const t=$('#t');t.textContent=m;t.className='show';clearTimeout(tt);tt=setTimeout(()=>t.className='',2800)};
const P=(s,i)=>S.sections[s].products[i];
const szl=p=>(p.sizes||'').split(/[,،]/).map(x=>x.trim()).filter(Boolean);
const isOut=p=>!!p.out||(szl(p).length>0&&szl(p).every(z=>(p.na||[]).includes(z)));

function card(p,s,i){
const im=p.imgs||[],sz=szl(p),na=p.na||[],ok=sz.filter(z=>!na.includes(z)),out=isOut(p);
return `<article class="card${out?' out':''}" data-s="${s}" data-i="${i}"><div class="gw">${out?'<div class="so"><b>SOLD OUT</b></div>':''}${off(p)?`<span class="bd">-${pct(p)}%</span>`:''}<div class="gal">${im.length?im.map(u=>`<img src="${u}" alt="${esc(p.name)}" loading="lazy">`).join(''):'<div class="ph">KLORSS</div>'}</div>${im.length>1?`<button class="ar p" data-d="-1">‹</button><button class="ar n" data-d="1">›</button><div class="dots">${im.map((_,j)=>`<i class="${j?'':'on'}"></i>`).join('')}</div>`:''}</div><div class="inf"><h3>${esc(p.name)}</h3><div class="pr">${fmt(p.price)} EGP${off(p)?` <s>${fmt(p.old)} EGP</s>`:''}</div><div class="sz">${sz.map(z=>`<button class="${na.includes(z)?'x':z===ok[0]?'on':''}" data-z="${esc(z)}">${esc(z)}</button>`).join('')}</div>${out?'<span class="ord no">Sold out</span>':`<a class="ord" target="_blank" rel="noopener" href="${link(p,ok[0]||'')}">Order on WhatsApp</a>`}</div></article>`}

let cur='all';
function render(){
const all=S.sections.map((c,s)=>[c,s]).filter(x=>x[0].products.length);
if(cur!=='all'&&!all.some(x=>x[1]===cur))cur='all';
const ss=cur==='all'?all:all.filter(x=>x[1]===cur);
$('#app').innerHTML=`<header class="hero"><h1 class="logo">KLORSS</h1>${all.length>1?`<nav><button class="${cur==='all'?'on':''}" data-f="all">All</button>${all.map(([c,s])=>`<button class="${cur===s?'on':''}" data-f="${s}">${esc(c.name)}</button>`).join('')}</nav>`:''}</header><div class="wrap">${ss.map(([c,s])=>`<section id="s${s}"><h2 class="t1">${esc(c.name)}</h2><div class="grid">${c.products.map((p,i)=>card(p,s,i)).join('')}</div></section>`).join('')||'<p class="hint">Coming soon</p>'}</div><footer>© KLORSS · WhatsApp <a href="https://wa.me/${S.wa}" target="_blank" rel="noopener">${disp()}</a></footer><a class="wa" href="https://wa.me/${S.wa}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>`}

$('#app').addEventListener('click',e=>{
const f=e.target.closest('[data-f]');if(f){const v=f.dataset.f;cur=v==='all'?'all':+v;render();return}
const c=e.target.closest('.card');if(!c)return;
const p=P(+c.dataset.s,+c.dataset.i),b=e.target.closest('.ar'),z=e.target.closest('[data-z]');
if(b){const g=c.querySelector('.gal'),n=g.children.length,i=Math.round(g.scrollLeft/g.clientWidth);g.children[(i+ +b.dataset.d+n)%n].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
if(z&&!z.classList.contains('x')){c.querySelectorAll('[data-z]').forEach(x=>x.classList.toggle('on',x===z));c.querySelector('.ord').href=link(p,z.dataset.z)}
});
addEventListener('scroll',e=>{const g=e.target;if(!g.classList||!g.classList.contains('gal'))return;const i=Math.round(g.scrollLeft/g.clientWidth);g.parentNode.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===i))},true);

/* ---------- Admin ---------- */
const A=$('#adm');
const chips=(p,s,i)=>{const z=szl(p),na=p.na||[];return z.length?`<div class="szs">${z.map(x=>`<button class="chip${na.includes(x)?' no':''}" data-n="${s},${i},${esc(x)}">${esc(x)} ${na.includes(x)?'✕':'✓'}</button>`).join('')}</div>`:''};
const at=(s,i)=>`data-s="${s}" data-i="${i}"`;
function adm(){
const y=A.scrollTop;
A.innerHTML=`<div class="ah"><h2>Admin</h2><button class="btn" data-x="close">Back to site</button></div><label>WhatsApp number (e.g. 01092207481)<input data-k="wa" value="${esc(S.wa)}" inputmode="numeric"></label>`+
S.sections.map((c,s)=>`<section class="sec"><div class="r2"><input data-s="${s}" data-k="name" value="${esc(c.name)}" placeholder="Section name"><button class="btn dng" data-dels="${s}">Delete section</button></div>`+
c.products.map((p,i)=>`<div class="pa"><input ${at(s,i)} data-k="name" value="${esc(p.name)}" placeholder="Product name"><div class="r2"><input ${at(s,i)} data-k="price" value="${esc(p.price)}" inputmode="numeric" placeholder="Price (EGP)"><input ${at(s,i)} data-k="old" value="${esc(p.old||'')}" inputmode="numeric" placeholder="Old price (optional)"></div><input ${at(s,i)} data-k="sizes" value="${esc(p.sizes)}" placeholder="Sizes: M, L, XL">${chips(p,s,i)}<button class="btn${p.out?' dng':''}" data-t="${s},${i}">${p.out?'Sold out ✕':'Available ✓'}</button><div class="th">${(p.imgs||[]).map((u,j)=>`<span class="t"><img src="${u}" data-m="${s},${i},${j}"><b data-r="${s},${i},${j}">✕</b></span>`).join('')}</div><div class="r2"><label class="btn">+ Photos<input type="file" accept="image/*" multiple hidden data-u="${s},${i}"></label><button class="btn dng" data-del="${s},${i}">Delete</button></div></div>`).join('')+
`<button class="btn" data-addp="${s}">+ Add product</button></section>`).join('')+
`<button class="btn" data-x="adds">+ New section</button><button class="btn pri" data-x="save">Save changes (admin file)</button><button class="btn" data-x="client">Export client file (no edit)</button><p class="hint">Add an old price to show a crossed-out price and a discount badge. Tap a thumbnail to make it the first photo. Tap a size to mark it sold out (✕) or available (✓).</p>`;
A.scrollTop=y}

const comp=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};im.onerror=()=>r(null);im.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)});

A.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;const d=t.dataset;if(d.s===undefined)S[k]=t.value;else if(d.i===undefined)S.sections[+d.s][k]=t.value;else P(+d.s,+d.i)[k]=t.value});
A.addEventListener('change',async e=>{const t=e.target;if(t.dataset.k==='sizes'){adm();return}if(t.dataset.u===undefined)return;const[s,i]=t.dataset.u.split(',').map(Number),p=P(s,i);p.imgs=p.imgs||[];toast('Processing photos…');for(const f of [...t.files]){const d=await comp(f);if(d)p.imgs.push(d)}adm();toast('Photos added ✓')});
A.addEventListener('click',e=>{
const t=e.target.closest('[data-x],[data-del],[data-dels],[data-addp],[data-r],[data-m],[data-t],[data-n]');if(!t)return;
const d=t.dataset,n=v=>String(v).split(',').map(Number);
const sure=()=>{if(d.sure)return true;t.dataset.sure=1;t.textContent='Tap again to confirm';return false};
if(d.x==='close'){A.hidden=true;render()}
else if(d.x==='adds'){S.sections.push({name:'New section',products:[]});adm()}
else if(d.x==='save')save();
else if(d.x==='client')save(true);
else if(d.addp!==undefined){S.sections[+d.addp].products.push({name:'New product',price:0,old:'',sizes:'M, L, XL',imgs:[]});adm()}
else if(d.dels!==undefined){if(sure()){S.sections.splice(+d.dels,1);adm()}}
else if(d.del!==undefined){if(sure()){const[s,i]=n(d.del);S.sections[s].products.splice(i,1);adm()}}
else if(d.r){const[s,i,j]=n(d.r);P(s,i).imgs.splice(j,1);adm()}
else if(d.m){const[s,i,j]=n(d.m),im=P(s,i).imgs;im.unshift(...im.splice(j,1));adm()}
else if(d.t){const[s,i]=n(d.t),p=P(s,i);p.out=!p.out;adm()}
else if(d.n){const q=d.n.split(','),p=P(+q[0],+q[1]),z=q.slice(2).join(',');p.na=p.na||[];const k=p.na.indexOf(z);if(k<0)p.na.push(z);else p.na.splice(k,1);adm()}
});

const MARK='/* ---------- Admin -'+'--------- */',END='\nrender();\n})'+'();';
const cleanSrc=()=>{const c=document.documentElement.cloneNode(true);
const q=s=>c.querySelector(s);
q('#app').innerHTML='';q('#adm').innerHTML='';q('#adm').setAttribute('hidden','');q('#gear').setAttribute('hidden','');q('#t').className='';q('#t').textContent='';
return '<!doctype html>\n'+c.outerHTML};
function dl(name,h){const b=new Blob([h],{type:'text/html'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function save(client){
try{
S.wa=String(S.wa).replace(/\D/g,'').replace(/^0/,'20');
const j=JSON.stringify(S).replace(/</g,'\\u003c');
let h=cleanSrc().replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,x,y)=>x+j+y);
if(client){
const a0=h.indexOf(MARK),a1=h.lastIndexOf(END);
if(a0<0||a1<0){toast('Export failed');return}
h=h.slice(0,a0)+h.slice(a1);
h=h.replace(/<div id="adm"[\s\S]*?<\/div>\s*/,'').replace(/<button id="gear"[\s\S]*?<\/button>\s*/,'');
dl('KLORSS.html',h);toast('Client file downloaded ✓')
}else{dl('KLORSS-admin.html',h);toast('Saved ✓ use the new file next time')}
}catch(e){toast('Error: '+(e.message||''))}}

$('#gear').onclick=()=>{A.hidden=false;adm()};
$('#gear').hidden=false;
render();
})();
</script></body></html>
