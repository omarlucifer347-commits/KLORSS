<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse($('#data').textContent)}catch(e){S={}}
S.wa=S.wa||'201092207481';
if(!S.sections){S.sections=[{name:'Hoodies',products:S.products||[]}];delete S.products}
const fmt=n=>Number(n||0).toLocaleString('en');
const off=p=>+p.old>+p.price&&+p.price>0,pct=p=>Math.round((1-p.price/p.old)*100);
const link=(p,z)=>'https://wa.me/'+S.wa+'?text='+encodeURIComponent('Hi KLORSS, I want to order:\n'+p.name+'\n'+(z?'Size: '+z+'\n':'')+'Price: '+fmt(p.price)+' EGP'+(off(p)?' (offer, was '+fmt(p.old)+')':''));
const disp=()=>S.wa.startsWith('20')?'0'+S.wa.slice(2):S.wa;
let tt;const toast=m=>{const t=$('#t');t.textContent=m;t.className='show';clearTimeout(tt);tt=setTimeout(()=>t.className='',2800)};
const P=(s,i)=>S.sections[s].products[i];
const szl=p=>(p.sizes||'').split(/[,،]/).map(x=>x.trim()).filter(Boolean);
const isOut=p=>!!p.out||(szl(p).length>0&&szl(p).every(z=>(p.na||[]).includes(z)));

function card(p,s,i){
const im=p.imgs||[],sz=szl(p),na=p.na||[],ok=sz.filter(z=>!na.includes(z)),out=isOut(p);
return `<article class="card${out?' out':''}" data-s="${s}" data-i="${i}"><div class="gw">${out?'<div class="so"><b>SOLD OUT</b></div>':''}${off(p)?`<span class="bd">-${pct(p)}%</span>`:''}<div class="gal">${im.length?im.map(u=>`<img src="${u}" alt="${esc(p.name)}" loading="lazy">`).join(''):'<div class="ph">KLORSS</div>'}</div>${im.length>1?`<button class="ar p" data-d="-1">‹</button><button class="ar n" data-d="1">›</button><div class="dots">${im.map((_,j)=>`<i class="${j?'':'on'}"></i>`).join('')}</div>`:''}</div><div class="inf"><h3>${esc(p.name)}</h3><div class="pr">${fmt(p.price)} EGP${off(p)?` <s>${fmt(p.old)} EGP</s>`:''}</div><div class="sz">${sz.map(z=>`<button class="${na.includes(z)?'x':z===ok[0]?'on':''}" data-z="${esc(z)}">${esc(z)}</button>`).join('')}</div>${out?'<span class="ord no">Sold out</span>':`<a class="ord" target="_blank" rel="noopener" href="${link(p,ok[0]||'')}">Order on WhatsApp</a>`}</div></article>`}

let cur='all';
function render(){
const all=S.sections.map((c,s)=>[c,s]).filter(x=>x[0].products.length);
if(cur!=='all'&&!all.some(x=>x[1]===cur))cur='all';
const ss=cur==='all'?all:all.filter(x=>x[1]===cur);
$('#app').innerHTML=`<header class="hero"><h1 class="logo">KLORSS</h1>${all.length>1?`<nav><button class="${cur==='all'?'on':''}" data-f="all">All</button>${all.map(([c,s])=>`<button class="${cur===s?'on':''}" data-f="${s}">${esc(c.name)}</button>`).join('')}</nav>`:''}</header><div class="wrap">${ss.map(([c,s])=>`<section id="s${s}"><h2 class="t1">${esc(c.name)}</h2><div class="grid">${c.products.map((p,i)=>card(p,s,i)).join('')}</div></section>`).join('')||'<p class="hint">Coming soon</p>'}</div><footer>© KLORSS · WhatsApp <a href="https://wa.me/${S.wa}" target="_blank" rel="noopener">${disp()}</a></footer><a class="wa" href="https://wa.me/${S.wa}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>`}

$('#app').addEventListener('click',e=>{
const f=e.target.closest('[data-f]');if(f){const v=f.dataset.f;cur=v==='all'?'all':+v;render();return}
const c=e.target.closest('.card');if(!c)return;
const p=P(+c.dataset.s,+c.dataset.i),b=e.target.closest('.ar'),z=e.target.closest('[data-z]');
if(b){const g=c.querySelector('.gal'),n=g.children.length,i=Math.round(g.scrollLeft/g.clientWidth);g.children[(i+ +b.dataset.d+n)%n].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
if(z&&!z.classList.contains('x')){c.querySelectorAll('[data-z]').forEach(x=>x.classList.toggle('on',x===z));c.querySelector('.ord').href=link(p,z.dataset.z)}
});
addEventListener('scroll',e=>{const g=e.target;if(!g.classList||!g.classList.contains('gal'))return;const i=Math.round(g.scrollLeft/g.clientWidth);g.parentNode.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===i))},true);


render();
})();
</script></body></html>
